name: cinnamon

services:

  backend:
    build:
      context: ./backend
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
    container_name: cinnamon-backend
    env_file:
      - backend/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/scripts:/app/scripts
    restart: unless-stopped
    networks:
      - cinnamon-network

  frontend:
    build:
      context: ./front
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile}
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
        NEXT_PUBLIC_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL:-http://localhost:3000/api/storage}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
    container_name: cinnamon-frontend
    env_file:
      - front/.env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
      NEXT_PUBLIC_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL:-http://localhost:3000/api/storage}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    volumes:
      - ./front/app:/app/app
      - ./front/components:/app/components
      - ./front/lib:/app/lib
      - ./front/stores:/app/stores
      - ./front/public:/app/public
      - ./front/next.config.ts:/app/next.config.ts
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cinnamon-network

volumes:
  backend_uploads:
  backend_logs:

networks:
  cinnamon-network:
    driver: bridge
